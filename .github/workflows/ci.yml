name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tenant-rls:
    name: Tenant RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # PostgreSQL 17 matches NetEOC Dev (17.11). The image is pinned by digest,
    # so neither a runner image change nor a tag move can change the server.
    # PostGIS 3.6 is included for the feature geometry in #12. The image also
    # installs PostGIS into the default database's public schema, so the tests
    # run in a clean database instead (see the step below). Trust authentication
    # is acceptable here: the server exists only for this job and is not
    # reachable from outside the runner.
    services:
      postgres:
        image: postgis/postgis:17-3.6@sha256:d7053f57b0d62c427ffbf412208b6625317124d62eebf40672e990fea81e9d53
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
    steps:
      - name: Check out migrations and tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify PostgreSQL server version
        run: |
          psql -X -v ON_ERROR_STOP=1 -At -c 'select version()'
          server_version_num="$(psql -X -v ON_ERROR_STOP=1 -At -c 'show server_version_num')"
          if [ "$server_version_num" -lt 170000 ] || [ "$server_version_num" -ge 180000 ]; then
            echo "expected PostgreSQL 17, got server_version_num=$server_version_num" >&2
            exit 1
          fi
      - name: Create a clean test database
        # A database cloned from template0 has no extensions, as a new Supabase
        # project does. The migration then installs PostGIS into the extensions
        # schema, and a silent no-op on the image's public copy cannot hide that.
        # Later steps read PGDATABASE from GITHUB_ENV.
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'create database neteoc_test template template0'
          echo 'PGDATABASE=neteoc_test' >> "$GITHUB_ENV"
      - name: Run tenant authorization tests
        run: |
          psql -X -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -f tests/sql/ci-bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            psql -X -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -f "$migration"
          done
          psql -X -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -f tests/sql/tenant_read_kernel.sql
          psql -X -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -f tests/sql/operator_bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -f tests/sql/maps_layer_associations.sql
          psql -X -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -f tests/sql/organization_invitations.sql
          psql -X -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -f tests/sql/feature_storage.sql
          psql -X -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -f tests/sql/layer_feature_queries.sql
          bash tests/sql/feature_edits_run.sh
      - name: Run race tests against the disposable test database
        # These scripts commit fixtures and clear audit rows. The opt-in is set only
        # here, and each script also checks the database name the server reports.
        env:
          NETEOC_DISPOSABLE_DATABASE: '1'
        run: |
          bash tests/sql/organization_invitations_race.sh
          bash tests/sql/feature_edits_race.sh

  quality-security:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install Node.js for Wrangler
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting, lint, policy, and tests
        run: bun run check
      - name: Verify commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" | bun run commitlint
          git rev-list "$BASE_SHA..$HEAD_SHA" | while read -r commit; do
            git log -1 --format=%B "$commit" | bun run commitlint
          done
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install security tools
        run: |
          python3 scripts/install-tools.py
          python3 -m pip install --requirement requirements-security.txt
      - name: Lint GitHub workflows
        run: .tools/bin/actionlint -color
      - name: Scan source patterns
        run: bun run security:semgrep
      - name: Scan for vulnerable dependencies and misconfigurations
        run: bun run security:trivy
      - name: Audit Bun packages
        run: bun run security:audit
      - name: Scan working tree for credentials
        run: bun run secrets:tree
      - name: Scan repository history for credentials
        run: bun run secrets:history
